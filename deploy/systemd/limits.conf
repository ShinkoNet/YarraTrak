# Install as /etc/systemd/system/netcavy-yarratrak.service.d/limits.conf.
# Adjust paths if the service uses a different checkout or virtualenv.
[Service]
ExecStart=
ExecStart=/srv/http/yarratrak/venv/bin/python -m uvicorn server.api:app --host 127.0.0.1 --port 8000 --forwarded-allow-ips 127.0.0.1 --ws-max-size 16384 --ws-max-queue 4
